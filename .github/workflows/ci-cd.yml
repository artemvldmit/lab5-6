name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5001/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"x","password":"x"}' || echo "000")
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then
              echo "Backend is up (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i/30 - sleeping 3s... (got $STATUS)"
            sleep 3
          done

      - name: Check frontend responds
        run: |
          curl -sf http://127.0.0.1:8080 -o /dev/null
          echo "Frontend OK"

      - name: Check backend register endpoint
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5001/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","email":"test@example.com","password":"Test1234!"}')
          echo "Register status: $HTTP"
          test "$HTTP" = "201" || test "$HTTP" = "409"

      - name: Check backend login endpoint
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5001/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"Test1234!"}')
          echo "Login status: $HTTP"
          test "$HTTP" = "200" || test "$HTTP" = "401"

      - name: Check tasks endpoint returns 401 without token
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/tasks)
          echo "Tasks status: $HTTP"
          test "$HTTP" = "401"

      - name: Check categories endpoint returns 401 without token
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/categories)
          echo "Categories status: $HTTP"
          test "$HTTP" = "401"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Remove built images
        if: always()
        run: docker rmi $(docker images -q) --force 2>/dev/null || true

      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: iphonepasskey/lab6-backend:latest,iphonepasskey/lab6-backend:${{ github.sha }}

      - name: Push frontend image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: iphonepasskey/lab6-frontend:latest,iphonepasskey/lab6-frontend:${{ github.sha }}
