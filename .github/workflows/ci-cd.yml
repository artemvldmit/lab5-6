name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BACKEND_IMAGE: artemvldm/lab6-backend
  FRONTEND_IMAGE: artemvldm/lab6-frontend

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/auth/login \
                 -X POST -H "Content-Type: application/json" \
                 -d '{"email":"x","password":"x"}' > /dev/null 2>&1; then
              echo "Backend is up"
              break
            fi
            echo "Attempt $i/30 - sleeping 3s..."
            sleep 3
          done

      - name: Check frontend responds (HTTP 200)
        run: |
          curl -sf http://localhost:8080 -o /dev/null
          echo "Frontend OK"

      - name: Check backend /auth/register endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:5001/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","email":"test@example.com","password":"Test1234!"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Status: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "409" ]; then
            echo "Register endpoint OK"
          else
            echo "Register endpoint FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Check backend /auth/login endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5001/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"Test1234!"}')
          echo "Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "Login endpoint OK"
          else
            echo "Login endpoint FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Check backend /tasks endpoint (auth guard)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/tasks)
          echo "Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "401" ]; then
            echo "Tasks endpoint OK (correctly returns 401)"
          else
            echo "Unexpected status $HTTP_CODE"
            exit 1
          fi

      - name: Check backend /categories endpoint (auth guard)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/categories)
          echo "Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "401" ]; then
            echo "Categories endpoint OK (correctly returns 401)"
          else
            echo "Unexpected status $HTTP_CODE"
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Remove built images
        if: always()
        run: docker rmi $(docker images -q) --force 2>/dev/null || true

      - name: Rebuild and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Rebuild and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
